version: 2
updates:
  # Monthly, with minor/patch updates batched into one PR per ecosystem.
  # Major updates still arrive as separate PRs so they can be reviewed alone.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
    ignore:
      # v7 moves iOS to Swift Package Manager; needs a dedicated migration
      # (drop CocoaPods, adopt SwiftPM/UIScene). Revisit deliberately.
      - dependency-name: mobile_scanner
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
