name: iOS

on:
  push:
    branches: [main, toolchain-upgrade]
    paths:
      - ".github/workflows/ios.yml"
      - "ios/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "ios/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios.yml-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so builds are reproducible. Bump deliberately (see dependabot PRs).
  FLUTTER_VERSION: "3.47.6"

jobs:
  build:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
